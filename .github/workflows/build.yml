name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test bridge
        shell: pwsh
        run: .\build.ps1 -BridgeOnly
      - uses: actions/upload-artifact@v4
        with:
          name: iUsbBridge-win-x64
          path: |
            dist/iUsbBridge.exe
            dist/iUsbBridge.runtime.json
